name: Recall · Notificações diárias
on:
  schedule:
    # Fortaleza = UTC-3. Usar minutos fora de 00 reduz riscos de jobs descartados.
    # 12:11 UTC = 09:11 Fortaleza
    - cron: '11 12 * * *'
    # 15:11 UTC = 12:11 Fortaleza
    - cron: '11 15 * * *'
    # 17:11 UTC = 14:11 Fortaleza
    - cron: '11 17 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Notificação para teste manual'
        type: choice
        required: true
        default: english
        options:
          - english
          - german
          - reminder
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o Recall
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar biblioteca Web Push
        run: npm install --no-save --ignore-scripts --no-audit --no-fund web-push@3.6.7
      - name: Enviar mensagem
        env:
          RECALL_PUSH_CONFIG: ${{ secrets.RECALL_PUSH_CONFIG }}
          RECALL_SCHEDULE: ${{ github.event.schedule }}
          RECALL_KIND: ${{ inputs.kind }}
        run: node scripts/send-recall-push.cjs
