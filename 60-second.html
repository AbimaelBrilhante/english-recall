<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3C318C">
<title>60-Second Challenge Beta v3</title>
<style>
:root{--bg:#f7f7fb;--surface:#fff;--surface2:#f1f0f8;--ink:#1d1d29;--muted:#77778a;--line:#e3e2ec;--primary:#3c318c;--primary2:#5748cc;--danger:#ef476f;--good:#138a5b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px)}button{font:inherit;touch-action:manipulation}.app{max-width:680px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand b{font-size:26px}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.beta{font-size:9px;font-weight:900;background:var(--surface2);color:var(--primary2);padding:6px 8px;border-radius:999px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:12px}.chips{display:flex;gap:6px;align-items:center;margin-bottom:9px;flex-wrap:wrap}.chip{font-size:9px;font-weight:900;background:var(--surface2);color:var(--primary2);padding:5px 7px;border-radius:999px}.source{margin-left:auto;color:var(--muted);font-size:9px;font-weight:800}.center{text-align:center}.orb{width:76px;height:76px;border:1px solid var(--line);background:var(--surface2);border-radius:50%;font-size:30px}.hint{display:block;color:var(--muted);font-size:9.5px;line-height:1.45;margin-top:7px}.toggle,.btn{width:100%;min-height:44px;border-radius:12px;font-weight:850}.toggle{border:1px solid var(--line);background:var(--surface2);color:var(--ink);margin-top:10px}.fold{display:none;margin-top:9px;background:var(--surface2);padding:11px;border-radius:11px;color:var(--muted);font-size:11px;line-height:1.5}.fold.open{display:block}.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink)}.btn.primary{border:0;background:linear-gradient(135deg,#5f53dc,#8190ff);color:#fff}.btn.stop{border:0;background:var(--danger);color:#fff}.big{font-size:58px;font-weight:900;color:var(--primary2);margin:12px 0 2px}.state{font-size:9.5px;font-weight:900;letter-spacing:.08em;color:var(--muted)}.clock{font-size:28px;font-weight:900;margin:10px 0 3px}.note{font-size:9.5px;color:var(--muted);line-height:1.5;background:var(--surface2);padding:10px;border-radius:11px;margin-top:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.metric{background:var(--surface2);border-radius:11px;padding:9px;text-align:center}.metric b{display:block;font-size:17px}.metric span{font-size:8.7px;color:var(--muted)}.self{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.self button{min-height:40px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;font-size:9px;font-weight:850}.self button.on{border-color:var(--primary2);color:var(--primary2)}.history{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.hbox{background:var(--surface2);padding:10px;border-radius:12px;text-align:center}.hbox b{display:block;font-size:18px}.hbox span{font-size:8.5px;color:var(--muted)}.danger{color:#b42318}@media(max-width:430px){.grid2{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.metrics .metric:last-child{grid-column:1/-1}}@media(prefers-color-scheme:dark){:root{--bg:#12111a;--surface:#1c1a27;--surface2:#242132;--ink:#f5f3fb;--muted:#aaa5b9;--line:#353145}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div class="brand"><b>60-Second Challenge</b><span>60 temas · seleção adaptativa · Speaking Lab</span></div><span class="beta">BETA v3</span></div>
<div id="history" class="card"></div>
<div id="body"></div>
</main>
<script>
(()=>{'use strict';
const DB='recallSpeakingLabBetaV1',STORE='attempts';
const FILES=['./speaking-lab/60-second-curated-v2.json','./speaking-lab/60-second-professional-v2.json'];
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
let topics=[],current=null,state='ready',stream=null,rec=null,chunks=[],started=0,timer=null,autoStop=null,thinkingToken=0,url='',attemptId='',recognition=null,transcript='',used=new Set(),lastCategory='',playbackTimer=null,finishing=false;
function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function all(){const d=await db();const rows=await new Promise((res,rej)=>{const t=d.transaction(STORE,'readonly'),r=t.objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});d.close();return rows;}
async function put(v){const d=await db();await new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error);});d.close();}
function setAudio(type){try{if(navigator.audioSession)navigator.audioSession.type=type}catch{}}
function cancelPlaybackTimer(){if(playbackTimer)clearTimeout(playbackTimer);playbackTimer=null;}
function stopMedia(restorePlayback=true){if(timer)clearInterval(timer);if(autoStop)clearTimeout(autoStop);timer=null;autoStop=null;try{stream?.getTracks().forEach(t=>t.stop())}catch{}try{recognition?.abort?.()}catch{}stream=null;rec=null;chunks=[];recognition=null;started=0;cancelPlaybackTimer();if(restorePlayback)playbackTimer=setTimeout(()=>setAudio('playback'),120);}
async function mic(){cancelPlaybackTimer();try{speechSynthesis.cancel()}catch{}await sleep(220);setAudio('play-and-record');await sleep(120);return navigator.mediaDevices.getUserMedia({audio:true});}
function speak(text){return new Promise(res=>{if(!text){res();return}cancelPlaybackTimer();try{speechSynthesis.cancel()}catch{}setAudio('playback');const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.94;let done=false;const end=()=>{if(done)return;done=true;setAudio('playback');res()};u.onend=end;u.onerror=end;try{speechSynthesis.speak(u)}catch{end()}setTimeout(end,Math.max(5000,Math.min(18000,text.length*80)))})}
function startRecognition(){if(IOS)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;try{recognition=new SR();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=false;recognition.onresult=e=>{transcript=Array.from(e.results).map(r=>r[0]?.transcript||'').join(' ').trim()};recognition.start()}catch{recognition=null}}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
async function beginRecording(){stopMedia(false);transcript='';chunks=[];stream=await mic();const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(x=>MediaRecorder.isTypeSupported?.(x))||'';rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};rec.start();startRecognition();started=Date.now();state='recording';render();timer=setInterval(()=>{const e=$('clock');if(e)e.textContent=fmt(Date.now()-started)+' / 01:00'},250);autoStop=setTimeout(finish,60000);}
async function recordStop(){if(!rec)return null;const mr=rec,start=started;const blob=await new Promise(res=>{mr.onstop=()=>res(new Blob(chunks,{type:mr.mimeType||'audio/mp4'}));try{mr.stop()}catch{res(new Blob(chunks))}});try{recognition?.stop?.()}catch{}await sleep(250);const heard=transcript.trim(),dur=Math.min(60000,Math.max(0,Date.now()-start));stopMedia(true);if(url)URL.revokeObjectURL(url);url=blob.size?URL.createObjectURL(blob):'';return{blob,dur,transcript:heard}}
function playMine(){if(url)new Audio(url).play().catch(()=>{})}
async function load(){if(topics.length)return;for(const f of FILES){const j=await fetch(f+'?v=2',{cache:'no-store'}).then(r=>r.json());topics.push(...(j.topics||[]))}}
function historyMap(rows){const m={};for(const r of rows.filter(x=>x.mode==='60-second')){const k=r.topicId;if(!m[k])m[k]={attempts:0,lastTs:0,lastRating:null};m[k].attempts++;if((r.ts||0)>=m[k].lastTs){m[k].lastTs=r.ts||0;m[k].lastRating=r.selfRating||null}}return m}
function intervalFor(r){return r==='stuck'?3600000:r==='effort'?43200000:r==='natural'?345600000:86400000}
function overdue(h){if(!h)return Number.POSITIVE_INFINITY;return Date.now()-(h.lastTs+intervalFor(h.lastRating))}
async function chooseTopic(){const rows=await all(),hm=historyMap(rows);let pool=topics.filter(t=>!used.has(t.id));if(!pool.length){used.clear();pool=[...topics]}const alt=pool.filter(t=>t.category!==lastCategory);if(alt.length>=5)pool=alt;const recovery=pool.filter(t=>['stuck','effort'].includes(hm[t.id]?.lastRating)&&overdue(hm[t.id])>=0);const unseen=pool.filter(t=>!hm[t.id]);let choice;if(recovery.length&&Math.random()<.35){choice=recovery.sort((a,b)=>overdue(hm[b.id])-overdue(hm[a.id])||Math.random()-.5)[0]}else if(unseen.length){choice=unseen[Math.floor(Math.random()*unseen.length)]}else{choice=pool.sort((a,b)=>overdue(hm[b.id])-overdue(hm[a.id])||Math.random()-.5)[0]}current=choice;used.add(choice.id);lastCategory=choice.category;return choice}
async function updateHistory(){const rows=(await all()).filter(x=>x.mode==='60-second'),rated=rows.filter(x=>x.selfRating);const stuck=rated.filter(x=>x.selfRating==='stuck').length,effort=rated.filter(x=>x.selfRating==='effort').length,natural=rated.filter(x=>x.selfRating==='natural').length;$('history').innerHTML=`<div class="history"><div class="hbox"><b>${rows.length}</b><span>respostas</span></div><div class="hbox"><b>${stuck+effort}</b><span>para recuperar</span></div><div class="hbox"><b>${natural}</b><span>naturais</span></div></div><div class="note">Temas novos têm prioridade. Quando um tema marcado como <b>Travei</b> ou <b>Com esforço</b> fica devido, ele pode voltar em cerca de 35% das oportunidades. <b>Natural</b> fica mais espaçado.</div>`}
async function setSelf(v,b){document.querySelectorAll('[data-self]').forEach(x=>x.classList.toggle('on',x===b));if(!attemptId)return;const rows=await all(),row=rows.find(x=>x.id===attemptId);if(row){row.selfRating=v;await put(row);await updateHistory()}}
function sourceLabel(x){return x.source==='professional_context'?'contexto profissional':'banco curado'}
function render(result=null,thinking=10,msg=''){const x=current,b=$('body');if(!x){b.innerHTML='<div class="card">Nenhum tema carregado.</div>';return}const meta=`<div class="chips"><span class="chip">${esc(x.level)}</span><span class="chip">${esc(x.category)}</span><span class="source">${sourceLabel(x)}</span></div>`;
if(state==='ready'||state==='prompt'){b.innerHTML=meta+`<div class="card center"><button class="orb" id="hear">🔊</button><span class="hint">Toque para ouvir o tema</span><h3>Pronto para um minuto?</h3><span class="hint">Depois do áudio, você terá 10 segundos para organizar a resposta.</span><button class="toggle" id="show">Mostrar tema</button><div class="fold" id="prompt">${esc(x.prompt)}</div>${msg?`<div class="note danger">${esc(msg)}</div>`:''}<button class="btn primary" id="start" style="margin-top:12px">${state==='prompt'?'Ouvindo…':'▶ Começar desafio'}</button></div>`;$('hear').onclick=()=>speak(x.prompt);$('show').onclick=()=>$('prompt').classList.toggle('open');$('start').onclick=start;return}
if(state==='thinking'){b.innerHTML=meta+`<div class="card center"><div class="state">ORGANIZE SUA RESPOSTA</div><div class="big">${thinking}</div><div class="note">Estrutura simples: contexto → ação → resultado.</div><button class="toggle" id="show">Mostrar tema</button><div class="fold" id="prompt">${esc(x.prompt)}</div></div>`;$('show').onclick=()=>$('prompt').classList.toggle('open');return}
if(state==='recording'){b.innerHTML=meta+`<div class="card center"><div class="state">● RESPONDENDO</div><div class="clock" id="clock">00:00 / 01:00</div><button class="btn stop" id="stop" style="margin-top:14px">■ Encerrar resposta</button><button class="toggle" id="show">Mostrar tema</button><div class="fold" id="prompt">${esc(x.prompt)}</div></div>`;$('stop').onclick=finish;$('show').onclick=()=>$('prompt').classList.toggle('open');return}
const wc=result.transcript?result.transcript.trim().split(/\s+/).filter(Boolean).length:0,reliable=result.transcript&&result.dur>=15000&&wc>=10,wpm=reliable?Math.round(wc/(result.dur/60000)):null;b.innerHTML=meta+`<div class="card"><div style="color:var(--good);font-size:11px;font-weight:900">✓ Resposta salva</div><div class="metrics"><div class="metric"><b>${fmt(result.dur)}</b><span>duração</span></div><div class="metric"><b>${result.transcript?wc:'—'}</b><span>palavras</span></div><div class="metric"><b>${wpm??'—'}</b><span>palavras/min*</span></div></div><div class="note">${result.transcript?(reliable?'Ritmo estimado em '+wpm+' palavras/min com base apenas na transcrição e duração.':'Transcrição disponível, mas curta demais para estimar ritmo com utilidade.'):'Sem transcrição automática. A gravação continua válida.'}</div><div class="grid2"><button class="btn" id="mine">▶ Minha resposta</button><button class="btn primary" id="model">▶ Exemplo de resposta</button></div>${result.transcript?`<button class="toggle" id="showT">Mostrar transcrição</button><div class="fold" id="tr">${esc(result.transcript)}</div>`:''}<button class="toggle" id="showS">Mostrar estrutura sugerida</button><div class="fold" id="st">${(x.anchors||[]).map(a=>'• '+esc(a)).join('<br>')}</div><button class="toggle" id="showM">Mostrar exemplo escrito</button><div class="fold" id="mt">${esc(x.model)}</div><div class="note">A resposta-modelo é referência, não a única resposta possível. O app não avalia pronúncia automaticamente.</div><div style="margin-top:11px;font-size:10px;color:var(--muted)">Como saiu?</div><div class="self"><button data-self="stuck">Travei</button><button data-self="effort">Com esforço</button><button data-self="natural">Natural</button></div></div><div class="grid2"><button class="btn" id="repeat">↻ Repetir tema</button><button class="btn primary" id="next">Outro tema →</button></div>`;$('mine').onclick=playMine;$('model').onclick=()=>speak(x.model);if($('showT'))$('showT').onclick=()=>$('tr').classList.toggle('open');$('showS').onclick=()=>$('st').classList.toggle('open');$('showM').onclick=()=>$('mt').classList.toggle('open');document.querySelectorAll('[data-self]').forEach(bt=>bt.onclick=()=>setSelf(bt.dataset.self,bt));$('repeat').onclick=()=>{state='ready';render()};$('next').onclick=async()=>{await chooseTopic();attemptId='';state='ready';render()}}
async function start(){state='prompt';render();await speak(current.prompt);if(state!=='prompt')return;state='thinking';const token=++thinkingToken;for(let n=10;n>=1;n--){if(token!==thinkingToken||state!=='thinking')return;render(null,n);await sleep(1000)}if(token!==thinkingToken||state!=='thinking')return;try{await beginRecording()}catch(e){stopMedia(true);state='ready';render(null,10,'Falha do microfone: '+(e?.name||'erro')+(e?.message?' — '+e.message:''));}}
async function finish(){if(finishing||state!=='recording')return;finishing=true;const r=await recordStop();finishing=false;if(!r||!r.blob.size){state='ready';render(null,10,'A gravação não foi salva. Tente novamente.');return}attemptId='60s|'+current.id+'|'+Date.now();await put({id:attemptId,mode:'60-second',topicId:current.id,category:current.category,level:current.level,source:current.source,tags:current.tags||[],ts:Date.now(),durationMs:r.dur,transcript:r.transcript,blob:r.blob,selfRating:null});state='done';render(r);await updateHistory()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='recording')finish();else if(document.hidden){thinkingToken++;stopMedia(true)}});
(async()=>{try{await load();await updateHistory();await chooseTopic();render()}catch(e){$('body').innerHTML='<div class="card danger">Não consegui carregar o banco do 60-Second Challenge: '+esc(e?.message||e)+'</div>'}})();
})();
</script>
</body>
</html>
