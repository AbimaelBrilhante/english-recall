<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3C318C">
<title>Error Rescue Beta</title>
<style>
:root{--bg:#f7f7fb;--surface:#fff;--surface2:#f1f0f8;--ink:#1d1d29;--muted:#77778a;--line:#e3e2ec;--primary:#3c318c;--primary2:#5748cc;--danger:#ef476f;--good:#138a5b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px)}button{font:inherit;touch-action:manipulation}.app{max-width:680px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand b{font-size:27px}.brand span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.beta{font-size:9px;font-weight:900;background:var(--surface2);color:var(--primary2);padding:6px 8px;border-radius:999px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:12px}.chips{display:flex;align-items:center;gap:6px;margin-bottom:9px}.chip{font-size:9px;font-weight:900;background:var(--surface2);color:var(--primary2);padding:5px 7px;border-radius:999px}.pos{margin-left:auto;font-size:10px;color:var(--muted);font-weight:900}.track{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-bottom:12px}.fill{height:100%;background:linear-gradient(90deg,var(--primary),#8190ff)}.center{text-align:center}.orb{width:74px;height:74px;border:1px solid var(--line);background:var(--surface2);border-radius:50%;font-size:29px}.hint{display:block;color:var(--muted);font-size:9.5px;margin-top:7px}.toggle,.btn{width:100%;min-height:44px;border-radius:12px;font-weight:850}.toggle{border:1px solid var(--line);background:var(--surface2);color:var(--ink);margin-top:10px}.fold{display:none;margin-top:9px;background:var(--surface2);padding:11px;border-radius:11px;color:var(--muted);font-size:11px;line-height:1.45}.fold.open{display:block}.mic{width:98px;height:98px;border:0;border-radius:50%;background:linear-gradient(145deg,#5f53dc,#8190ff);color:white;font-size:39px;box-shadow:0 0 0 8px rgba(96,83,220,.08)}.recording .mic{background:linear-gradient(145deg,#ed4d72,#ff8099)}.state{font-size:9.5px;font-weight:900;letter-spacing:.08em;color:var(--muted);margin-top:10px}.clock{font-size:22px;font-weight:900;margin-top:2px}.ok{font-size:11px;color:var(--good);font-weight:900}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink)}.btn.primary{border:0;background:linear-gradient(135deg,#5f53dc,#8190ff);color:#fff}.self{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.self button{min-height:39px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;font-size:9px;font-weight:850}.self button.on{border-color:var(--primary2);color:var(--primary2)}.note{font-size:9.5px;color:var(--muted);line-height:1.5;background:var(--surface2);padding:10px;border-radius:11px;margin-top:9px}.pattern{border-left:4px solid var(--primary2);padding-left:11px;margin-top:10px}.pattern b{display:block;font-size:13px}.pattern span{display:block;color:var(--muted);font-size:10px;line-height:1.45;margin-top:3px}.stop{background:var(--danger);color:white;border:0}.hidden{display:none!important}.summary{text-align:center}.summary h2{margin:4px 0 6px}.summary p{color:var(--muted);font-size:11px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:var(--surface2);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:var(--muted)}@media(max-width:430px){.grid2{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#12111a;--surface:#1c1a27;--surface2:#242132;--ink:#f5f3fb;--muted:#aaa5b9;--line:#353145}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="brand"><b>Error Rescue</b><span>Padrões recorrentes · Speaking Lab</span></div><span class="beta">BETA</span></div>
  <div id="body"></div>
</main>
<script>
(()=>{'use strict';
const DB='recallSpeakingLabBetaV1',STORE='attempts',CONTENT='./speaking-lab/error-rescue-v1.json',SESSION=6;const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let patterns=[],items=[],idx=0,stream=null,rec=null,chunks=[],started=0,timer=null,url='',attemptId='',recognition=null,transcript='',state='ready',sessionStart=Date.now();
function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function all(){const d=await db();const x=await new Promise((res,rej)=>{const t=d.transaction(STORE,'readonly'),r=t.objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});d.close();return x;}
async function put(v){const d=await db();await new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error);});d.close();}
function setAudio(type){try{if(navigator.audioSession)navigator.audioSession.type=type}catch{}}
function stopMedia(){if(timer)clearInterval(timer);timer=null;try{stream?.getTracks().forEach(t=>t.stop())}catch{}try{recognition?.abort?.()}catch{}stream=null;rec=null;chunks=[];recognition=null;started=0;setTimeout(()=>setAudio('playback'),80)}
async function mic(){setAudio('play-and-record');await sleep(140);return navigator.mediaDevices.getUserMedia({audio:true});}
function speak(text,lang='en-US'){return new Promise(res=>{try{speechSynthesis.cancel()}catch{}const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang.startsWith('pt')?.98:.94;let done=false;const end=()=>{if(done)return;done=true;setAudio('playback');res()};u.onend=end;u.onerror=end;try{speechSynthesis.speak(u)}catch{end()}setTimeout(end,Math.max(4500,Math.min(16000,text.length*80)))})}
function startRecognition(){if(IOS)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;try{recognition=new SR();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=false;recognition.onresult=e=>{transcript=Array.from(e.results).map(r=>r[0]?.transcript||'').join(' ').trim()};recognition.start()}catch{recognition=null}}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
async function recordStart(){stopMedia();transcript='';chunks=[];stream=await mic();const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(x=>MediaRecorder.isTypeSupported?.(x))||'';rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};rec.start();startRecognition();started=Date.now();state='recording';render();timer=setInterval(()=>{const e=$('clock');if(e)e.textContent=fmt(Date.now()-started)},250)}
async function recordStop(){if(!rec)return null;const mr=rec,start=started;const blob=await new Promise(res=>{mr.onstop=()=>res(new Blob(chunks,{type:mr.mimeType||'audio/mp4'}));try{mr.stop()}catch{res(new Blob(chunks))}});try{recognition?.stop?.()}catch{}await sleep(250);const heard=transcript.trim(),dur=Math.max(0,Date.now()-start);stopMedia();if(url)URL.revokeObjectURL(url);url=blob.size?URL.createObjectURL(blob):'';return{blob,dur,transcript:heard}}
async function load(){const j=await fetch(CONTENT+'?v=1',{cache:'no-store'}).then(r=>r.json());patterns=j.patterns||[];const rows=await all(),last={};rows.filter(x=>x.mode==='error-rescue').forEach(x=>last[x.patternId]=Math.max(last[x.patternId]||0,x.ts||0));const ordered=[...patterns].sort((a,b)=>(last[a.id]||0)-(last[b.id]||0)||Math.random()-.5);items=ordered.slice(0,SESSION).map(p=>{const e=p.exercises[Math.floor(Math.random()*p.exercises.length)];return{...e,patternId:p.id,patternLabel:p.label,note:p.note}});idx=0;sessionStart=Date.now()}
function x(){return items[idx]}
async function hearPrompt(){const e=x();if(e)await speak(e.prompt,e.lang||'en-US')}
async function hearModel(){const e=x();if(e)await speak(e.model,'en-US')}
async function start(){try{await recordStart()}catch(err){state='ready';render(`Falha do microfone: ${esc(err?.name||'erro')}${err?.message?'<br>'+esc(err.message):''}`)}}
async function finish(){const e=x(),r=await recordStop();if(!r||!r.blob.size){state='ready';render('A gravação não foi salva. Tente novamente.');return}attemptId=`er|${e.id}|${Date.now()}`;await put({id:attemptId,mode:'error-rescue',exerciseId:e.id,patternId:e.patternId,level:e.level,ts:Date.now(),durationMs:r.dur,transcript:r.transcript,blob:r.blob,selfRating:null});state='done';render('',r)}
async function self(v,b){document.querySelectorAll('[data-self]').forEach(x=>x.classList.toggle('on',x===b));const rows=await all(),row=rows.find(x=>x.id===attemptId);if(row){row.selfRating=v;await put(row)}}
function playMine(){if(url)new Audio(url).play().catch(()=>{})}
function next(){stopMedia();if(url){URL.revokeObjectURL(url);url=''}attemptId='';state='ready';idx++;render()}
function repeat(){stopMedia();attemptId='';state='ready';render()}
function finishScreen(){const done=items.length;document.getElementById('body').innerHTML=`<div class="card summary"><div style="font-size:40px">🛟</div><h2>Sessão concluída</h2><p>Você trabalhou ${done} padrões sem depender de digitação. Os resultados abaixo são apenas objetivos; qualidade e naturalidade continuam na sua autoavaliação.</p><div class="stats"><div class="stat"><b>${done}</b><span>tentativas</span></div><div class="stat"><b>${Math.max(1,Math.round((Date.now()-sessionStart)/60000))}</b><span>minutos</span></div><div class="stat"><b>${new Set(items.map(i=>i.patternId)).size}</b><span>padrões</span></div></div><button class="btn primary" id="again" style="margin-top:14px">Nova sessão</button></div>`;$('again').onclick=async()=>{await load();state='ready';render()}}
function render(msg='',result=null){if(idx>=items.length){finishScreen();return}const e=x(),pct=Math.round(idx/items.length*100),body=$('body');body.innerHTML=`<div class="chips"><span class="chip">${esc(e.level)}</span><span class="chip">Error Rescue</span><span class="pos">${idx+1}/${items.length}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div>`;
if(state==='ready'){body.innerHTML+=`<div class="card center"><button class="orb" id="hear">🔊</button><span class="hint">Toque para repetir</span><button class="toggle" id="show">Mostrar instrução</button><div class="fold" id="prompt">${esc(e.prompt)}</div>${msg?`<div class="note danger">${msg}</div>`:''}</div><div class="card center"><button class="mic" id="mic">🎙</button><div class="state">TOQUE E RESPONDA EM INGLÊS</div><div class="clock">00:00</div><div class="note">O padrão de erro só aparece depois da sua resposta. Não é um teste de pronúncia.</div></div>`;$('hear').onclick=hearPrompt;$('show').onclick=()=>$('prompt').classList.toggle('open');$('mic').onclick=start;return}
if(state==='recording'){body.innerHTML+=`<div class="card center recording"><button class="mic" id="mic">🎙</button><div class="state">RESPONDENDO...</div><div class="clock" id="clock">00:00</div><button class="btn stop" id="stop" style="margin-top:12px">Parar</button></div>`;$('stop').onclick=finish;return}
if(state==='done'){body.innerHTML+=`<div class="card"><div class="ok">✓ Resposta salva</div><div class="grid2"><button class="btn" id="mine">▶ Minha resposta</button><button class="btn primary" id="model">▶ Resposta-modelo</button></div>${result?.transcript?`<button class="toggle" id="showT">Mostrar transcrição</button><div class="fold" id="tr">${esc(result.transcript)}</div>`:''}<button class="toggle" id="showM">Mostrar resposta escrita</button><div class="fold" id="modelText">${esc(e.model)}</div><div class="pattern"><b>Padrão: ${esc(e.patternLabel)}</b><span>${esc(e.note)}</span></div><div class="note">A resposta-modelo é uma referência, não a única resposta possível. O app não marca automaticamente como errado só porque você falou diferente.</div><div style="margin-top:11px;font-size:10px;color:var(--muted)">Como saiu?</div><div class="self"><button data-self="stuck">😣 Travei</button><button data-self="effort">😐 Com esforço</button><button data-self="natural">🙂 Natural</button></div></div><div class="grid2"><button class="btn" id="repeat">↻ Repetir</button><button class="btn primary" id="next">Próximo →</button></div>`;$('mine').onclick=playMine;$('model').onclick=hearModel;$('showM').onclick=()=>$('modelText').classList.toggle('open');if($('showT'))$('showT').onclick=()=>$('tr').classList.toggle('open');document.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>self(b.dataset.self,b));$('repeat').onclick=repeat;$('next').onclick=next}
}
load().then(()=>{state='ready';render();hearPrompt()}).catch(err=>{$('body').innerHTML=`<div class="card"><b>Não consegui carregar o Error Rescue.</b><div class="note danger">${esc(err?.message||err)}</div></div>`});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='recording')finish()});
})();
</script>
</body>
</html>
