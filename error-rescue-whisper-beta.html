<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3C318C">
<title>Error Rescue · Whisper Beta</title>
<style>
:root{--bg:#f7f7fb;--surface:#fff;--ink:#1d1d29;--muted:#77778a;--line:#e3e2ec}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px)}.card{max-width:680px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}.card h1{font-size:23px;margin:0 0 8px}.card p{font-size:11px;line-height:1.5;color:var(--muted);margin:0}@media(prefers-color-scheme:dark){:root{--bg:#12111a;--surface:#1c1a27;--ink:#f5f3fb;--muted:#aaa5b9;--line:#353145}}
</style>
</head>
<body>
<div class="card" id="loading"><h1>Carregando Error Rescue…</h1><p>Beta de transcrição local pós-gravação.</p></div>
<script>
(()=>{'use strict';
fetch('./error-rescue.html?whisper-beta=1',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('Falha ao carregar Error Rescue');return r.text();})
  .then(html=>{
    const injected='<script type="module" src="./error-rescue-whisper-feedback-v1.js?v=1"><\/script>';
    html=html.replace('</body>',injected+'\n</body>');
    document.open();document.write(html);document.close();
  })
  .catch(err=>{document.getElementById('loading').innerHTML='<h1>Não consegui abrir o beta</h1><p>'+String(err.message||err)+'</p>';});
})();
</script>
</body>
</html>
