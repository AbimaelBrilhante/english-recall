<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3C318C">
<title>Recall Beta</title>
<style>
html,body{margin:0;min-height:100%;background:#f7f7fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:#1d1d29}.beta-loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.beta-loading div{max-width:360px}.beta-loading b{display:block;font-size:24px;color:#3c318c;margin-bottom:8px}.beta-loading span{font-size:14px;color:#77778a;line-height:1.5}.beta-error{color:#b42318!important;white-space:pre-wrap}
@media(prefers-color-scheme:dark){html,body{background:#12111a;color:#f5f3fb}.beta-loading span{color:#aaa5b9}}
</style>
</head>
<body>
<div class="beta-loading" id="betaLoading"><div><b>Recall Beta</b><span>Carregando a cópia isolada do Recall + Speaking Lab…</span></div></div>
<script>
(async()=>{
  const load=document.getElementById('betaLoading');
  const modules=[
    'voice-diagnostics.js','audio-bridge.js','home-controls.js','recall-features-v2.js','home-layout-v2.js','recall-advanced-v3.js','recall-flow-fixes-v14.js','recall-single-audio-v14-1.js','recall-auto-tags-v15.js','recall-practice-v16.js','recall-review-layout-v16-1.js','recall-modern-v17.js','recall-audio-dedupe-v17-1.js','recall-insights-v18.js','recall-cefr-v18-1.js','recall-learning-v19.js','recall-ios-pt-speech-v19-3.js','recall-handsfree-recognition-v20-11.js','recall-handsfree-production-v19-2.js','recall-cram-natural-v19-4.js','recall-study-window-v19-8.js','recall-smart-sessions-v19-9.js','recall-home-v20.js','recall-repair-v20-7.js','recall-version-v18-1.js','recall-speaking-lab-ios-mic-fix-v1.js','recall-speaking-lab-bank-v1.js','recall-speaking-lab-beta-v2.js','recall-speaking-lab-60-v2.js'
  ];
  function bridge(text){
    if(text.includes('window.recallCore=')) return text;
    const marker='\n})();\n</script'+'>';
    const i=text.lastIndexOf(marker);
    if(i<0) throw new Error('Não encontrei o ponto de integração do núcleo.');
    const b=`\nwindow.recallCore={DECKS,DAY,$,getState:()=>state,save:()=>save(),clearCurrentItem:()=>{currentItem=null;},getCurrentView:()=>currentView,current,selectedDeck,selectedMode,selectDeck:(id,autoplay=true)=>selectDeck(id,autoplay),dayKey,endOfDay,dueNow,todayStudyCount,showView,speakText,render:()=>render(),renderLibrary:()=>renderLibrary(),syncAll:(...a)=>syncAll(...a),startSession:(deckId)=>{state.settings.selectedDeck=deckId;currentItem=null;flipped=false;sessionInitial=dueNow(deckId).length;sessionDone=0;if($('libraryDeck'))$('libraryDeck').value=deckId;if($('addDeck'))$('addDeck').value=deckId;if($('settingsDeck'))$('settingsDeck').value=deckId;if($('speed'))$('speed').value=String(state.settings.speedByDeck[deckId]||1);save();showView('review');render();maybeAutoPlayCurrent();},getCandidateItems:()=>candidateItems,setCandidateItems:f=>{candidateItems=f;},getRenderLibrary:()=>renderLibrary,setRenderLibrary:f=>{renderLibrary=f;},getRenderReview:()=>renderReview,setRenderReview:f=>{renderReview=f;},getRender:()=>render,setRender:f=>{render=f;},getSyncAll:()=>syncAll,setSyncAll:f=>{syncAll=f;},getRateCard:()=>rateCard,setRateCard:f=>{rateCard=f;},getRateSchedule:()=>rateSchedule,setRateSchedule:f=>{rateSchedule=f;}};\n`;
    return text.slice(0,i)+b+text.slice(i);
  }
  try{
    const r=await fetch('./index.html?beta=sentence-builder',{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar o Recall base: HTTP '+r.status);
    let t=bridge(await r.text());
    t=t.replace("if('serviceWorker'in navigator){","if(false && 'serviceWorker'in navigator){");
    if(!t.includes('theme-hotfix.css')) t=t.replace('</head>','<link rel="stylesheet" href="./theme-hotfix.css?v=beta-direct-4">\n</head>');
    if(!t.includes('recall-home-v20.css')) t=t.replace('</head>','<link rel="stylesheet" href="./recall-home-v20.css?v=beta-direct-4">\n</head>');
    for(const s of modules){
      if(!t.includes(s)) t=t.replace('</body>',`<script src="./${s}?v=beta-direct-4"><\/script>\n</body>`);
    }
    t=t.replace('<title>Recall</title>','<title>Recall Beta</title>');
    document.open();document.write(t);document.close();
  }catch(err){
    load.innerHTML='<div><b>Recall Beta</b><span class="beta-error">Não consegui montar o ambiente beta.\n'+String(err&&err.message||err)+'</span></div>';
  }
})();
</script>
</body>
</html>
